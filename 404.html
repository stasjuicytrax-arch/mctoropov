<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Страница не найдена | STASTOROPOV</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>document.documentElement.classList.replace('no-js', 'js')</script>
  <link rel="preload" href="/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles/404.css">
</head>
<body>
  <main class="nf sec sec--dark" data-theme="dark">
    <div class="container nf__inner">
      <a class="nf__logo wordmark" href="/" aria-label="Стас Торопов, на главную">
        <span aria-hidden="true">Т</span><span aria-hidden="true">О</span><span aria-hidden="true">Р</span><span aria-hidden="true">О</span><span aria-hidden="true">П</span><span aria-hidden="true">О</span><span aria-hidden="true">В</span>
      </a>
      <p class="rail"><span class="rail__num">404</span><span class="rail__sep">/</span><span>Страница не найдена</span></p>
      <h1 class="nf__title">Здесь пусто</h1>
      <p class="nf__text">Такой страницы на&nbsp;сайте нет. Возможно, ссылка устарела после переезда сайта.</p>
      <a class="btn btn--primary btn--l" href="/">
        <span class="btn__label">На главную</span>
        <span class="btn__arrow">{{icon:arrow-up-right}}</span>
      </a>
    </div>
    <span class="asterisk nf__asterisk" aria-hidden="true">{{icon:asterisk}}</span>
  </main>
  <div class="grain" aria-hidden="true"></div>
</body>
</html>
