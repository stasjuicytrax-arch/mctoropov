<section class="sec sec--light sec--rail stats" id="stats" data-theme="light" data-tear="1" aria-labelledby="stats-title" data-stats>
  <span class="barcode stats__barcode" aria-hidden="true"></span>

  <div class="container stats__grid">
    <div class="stats__main">
      <p class="rail"><span class="rail__num">06</span></p>
      <h2 class="stats__title" id="stats-title" aria-label="Я провёл 3000 ивентов">
        <span class="stats__pre">Я провёл</span>
        <span class="stats__big">
          <span class="count" data-count="3000"><span class="count__val">3000</span></span>
          <span class="stats__unit">ивентов</span>
        </span>
      </h2>
      <p class="stats__text" data-reveal="fade">— от&nbsp;небольших корпоративных вечеринок для топ-менеджмента корпораций до&nbsp;масштабного предъюбилейного Дня города Перми</p>

      <ul class="stats__facts" data-reveal="up">
        <li class="stats__fact" data-reveal-item>
          <span class="stats__num"><span class="count" data-count="17"><span class="count__val">17</span></span> <span class="stats__num-unit">лет</span></span>
          <span class="stats__cap">в&nbsp;индустрии развлечений</span>
        </li>
        <li class="stats__fact" data-reveal-item>
          <span class="stats__num"><span class="count" data-count="7"><span class="count__val">7</span></span> <span class="stats__num-unit">городов</span></span>
          <span class="stats__cap">Пермь, Екатеринбург, Сочи, Москва, Санкт-Петербург, Тюмень, Ижевск</span>
        </li>
      </ul>
    </div>

    <figure class="stats__photo">
      <picture class="stats__picture" data-parallax-inner>
        <source type="image/avif" srcset="/img/stats-hall-480.avif 480w, /img/stats-hall-896.avif 896w" sizes="(max-width: 767px) 90vw, 30vw">
        <source type="image/webp" srcset="/img/stats-hall-480.webp 480w, /img/stats-hall-896.webp 896w" sizes="(max-width: 767px) 90vw, 30vw">
        <img src="/img/stats-hall-896.jpg" alt="Полный зал зрителей на «Битве роботов», над трибунами операторский кран" width="896" height="1120" loading="lazy" decoding="async">
      </picture>
    </figure>
  </div>
</section>
