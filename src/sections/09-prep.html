<section class="sec sec--acid sec--rail prep" id="prep" data-theme="acid" data-tear="3" aria-labelledby="prep-title">
  <span class="asterisk prep__asterisk" aria-hidden="true">{{icon:asterisk}}</span>
  <span class="cross prep__cross prep__cross--tl" aria-hidden="true">{{icon:plus}}</span>
  <span class="cross prep__cross prep__cross--br" aria-hidden="true">{{icon:plus}}</span>

  <div class="container prep__grid">
    <div class="prep__head">
      <p class="rail"><span class="rail__num">08</span></p>
      <h2 class="h2 prep__title" id="prep-title" data-reveal="lines">Большое внимание подготовке</h2>
    </div>
    <p class="prep__text" data-reveal="fade">Удачной импровизации на&nbsp;сцене каждый раз предшествуют часы погружения в&nbsp;контекст. Ведущий разбирается в&nbsp;задаче заказчика, проговаривает возможные риски с&nbsp;организаторами, подключает к&nbsp;планированию других членов команды.</p>
  </div>
</section>
