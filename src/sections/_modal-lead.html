<!-- Поп-ап-форма из hero (кнопка «Узнать условия»). Нативный <dialog>: Esc, фокус-ловушка
     и подложка достаются от браузера, анимацию и закрытие по клику мимо делает modal.js.
     Форма та же, что в секции «Праздник за 7 дней», и уходит в тот же /api/lead. -->
<dialog class="modal" id="lead-modal" data-modal aria-labelledby="modal-title">
  <div class="modal__card" data-modal-card tabindex="-1">
    <button class="icon-btn modal__close" type="button" data-modal-close aria-label="Закрыть окно">{{icon:x}}</button>

    <p class="rail modal__rail"><span class="rail__num">01</span><span class="rail__sep">/</span><span>Заявка</span></p>
    <h2 class="h2 modal__title" id="modal-title">Обсудим ваше событие</h2>
    <p class="modal__sub">Оставьте телефон — перезвоню в&nbsp;течение часа, расспрошу про дату, площадку и&nbsp;гостей и&nbsp;назову стоимость.</p>

    <form class="lead__form modal__form" action="/api/lead" method="post" novalidate data-lead-form>
      <label class="lead__label" for="mlead-phone">Ваш телефон</label>
      <div class="lead__field">
        <input class="lead__input" id="mlead-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
               placeholder="+7 (___) ___-__-__" required aria-describedby="mlead-msg" data-lead-phone>
        <button class="btn btn--primary btn--l lead__submit" type="submit" data-lead-submit data-magnetic>
          <span class="btn__label" data-lead-label>Отправить</span>
          <span class="btn__arrow">
            <span class="lead__ico lead__ico--go">{{icon:arrow-up-right}}</span>
            <span class="lead__ico lead__ico--load">{{icon:loader-2}}</span>
            <span class="lead__ico lead__ico--ok">{{icon:check}}</span>
          </span>
        </button>
      </div>

      <!-- honeypot: люди поле не видят, боты заполняют -->
      <div class="lead__hp" aria-hidden="true">
        <label for="mlead-company">Компания</label>
        <input id="mlead-company" name="company" type="text" tabindex="-1" autocomplete="off" data-lead-hp>
      </div>

      <label class="lead__consent">
        <input class="lead__check" type="checkbox" name="consent" required data-lead-consent>
        <span class="lead__box" aria-hidden="true">{{icon:check}}</span>
        <span class="lead__consent-text">Нажимая кнопку «Отправить», вы&nbsp;принимаете <a href="/terms">пользовательское соглашение</a> и&nbsp;<a href="/privacy">политику конфиденциальности</a></span>
      </label>

      <p class="lead__msg" id="mlead-msg" role="status" aria-live="polite" data-lead-msg></p>
    </form>

    <p class="modal__alt">или сразу позвоните: <a class="lead__phone" href="tel:+79194459601" data-goal="call">+7 919 445 96 01</a></p>
  </div>
</dialog>
