<section class="sec sec--acid fearless" id="fearless" data-theme="acid" data-tear="3" aria-labelledby="fearless-title" data-fearless>
  <div class="fearless__pin" data-fearless-pin>
    <div class="container fearless__grid">
      <div class="fearless__aside">
        <p class="rail"><span class="rail__num">04</span></p>
        <h2 class="h2 fearless__title" id="fearless-title" data-reveal="lines">Я не боюсь</h2>
        <p class="fearless__count" aria-hidden="true">
          <span class="fearless__count-win"><span class="fearless__count-roll" data-fearless-roll><span>01</span><span>02</span><span>03</span><span>04</span></span></span>
          <span class="fearless__count-total">/04</span>
        </p>
      </div>

      <div class="fearless__viewport" data-fearless-viewport>
        <ol class="fearless__track" data-fearless-track>
          <li class="fearless__item" data-fearless-item><span class="fearless__num">01</span><p class="fearless__text">Выступать перед 10&nbsp;тысячами человек</p></li>
          <li class="fearless__item" data-fearless-item><span class="fearless__num">02</span><p class="fearless__text">Работать в&nbsp;кадре перед десятью камерами</p></li>
          <li class="fearless__item" data-fearless-item><span class="fearless__num">03</span><p class="fearless__text">Вести мероприятие 10&nbsp;часов нон-стопом</p></li>
          <li class="fearless__item" data-fearless-item><span class="fearless__num">04</span><p class="fearless__text">Общаться на&nbsp;одной сцене с&nbsp;большими артистами</p></li>
        </ol>
      </div>
    </div>
    <span class="asterisk fearless__asterisk" aria-hidden="true">{{icon:asterisk}}</span>
  </div>
</section>
